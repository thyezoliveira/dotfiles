- name: Configurar Vim
  hosts: localhost
  connection: local
  vars:
    vim_plugin_manager: "vim-plug"
  tasks:
    - name: Criar diretório .vim se não existir
      file:
        path: "{{ ansible_facts['env']['HOME'] }}/.vim"
        state: directory
        mode: '0755'

    - name: Copiar arquivo .vimrc
      copy:
        src: files/vimrc
        dest: "{{ ansible_facts['env']['HOME']  }}/.vimrc"
        mode: '0644'

    - name: Instalar vim-plug (gerenciador de plugins)
      get_url:
        url: https://raw.githubusercontent.com/junegunn/vim-plug/master/plug.vim
        dest: "{{ ansible_facts['env']['HOME'] }}/.vim/autoload/plug.vim"
        mode: '0644'
      when: "'vim-plug' in vim_plugin_manager"

    - name: Instalar plugins do Vim
      command: vim +PlugInstall +qall
      args:
        creates: "{{ ansible_facts['env']['HOME'] }}/.vim/plugged"
      when: "'vim-plug' in vim_plugin_manager"
